name: Send push notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/423130758383/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'firebase-adminsdk-fbsvc@studio-5633829332-99f59.iam.gserviceaccount.com'
      - name: Install firebase-admin
        run: npm init -y >/dev/null 2>&1; npm install firebase-admin@12 --no-audit --no-fund
      - name: Send pending push notifications
        run: node .github/scripts/send-push-notifications.js
